# docker compose up -d --build   →   game + API on http://localhost:${APP_PORT:-3100}
# Copy .env.example to .env and fill in the Keycloak / JWT values first.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sky_striker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_URL: ${MYSQL_URL:-mysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@db:3306/sky_striker}
    ports:
      - "${APP_PORT:-3100}:3100"

volumes:
  db-data:
